<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Acervo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">📚 Meu Acervo Pessoal</h1>
        <form action="/adicionar" method="post" class="row g-3 mb-4">
            <div class="col-md-4">
                <input type="text" name="nome" class="form-control" placeholder="Nome do item" required>
            </div>
            <div class="col-md-3">
                <select name="tipo" class="form-select">
                    <option value="Livro">Livro</option>
                    <option value="CD">CD</option>
                    <option value="DVD">DVD</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success">Adicionar</button>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itens %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nome }}</td>
                    <td>{{ item.tipo }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% if not itens %}
            <p class="text-muted">Nenhum item cadastrado ainda. Adicione o primeiro!</p>
        {% endif %}
    </div>
</body>
</html>
